# coturn TURN/STUN Server Config for WebRTC NAT traversal
# TODO: Replace placeholders before deploying

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=YOUR_PUBLIC_IP
external-ip=YOUR_PUBLIC_IP
realm=telephony.yourdomain.com
server-name=telephony.yourdomain.com

# Credentials
lt-cred-mech
user=webrtc:YourStrongPassword123

# TLS
cert=/etc/ssl/certs/turn.pem
pkey=/etc/ssl/private/turn.key

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Security
fingerprint
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255